<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <!-- G ring: center (210,200), radius 88, stroke 38 -->
  <!-- Arc from upper-right opening, counterclockwise over top/left/bottom back to center-right -->
  <path d="M 272 138 A 88 88 0 1 0 298 200"
        fill="none"
        stroke="#89CFF0"
        stroke-width="40"
        stroke-linecap="round"/>

  <!-- Crossbar: extends inward from arc end -->
  <path d="M 298 200 L 228 200"
        fill="none"
        stroke="#89CFF0"
        stroke-width="40"
        stroke-linecap="round"/>

  <!-- 3 wind marks on the left -->
  <path d="M 18 162 C 50 155 75 158 98 162"
        fill="none"
        stroke="#89CFF0"
        stroke-width="6"
        stroke-linecap="round"/>

  <path d="M 28 200 C 55 197 75 199 98 200"
        fill="none"
        stroke="#89CFF0"
        stroke-width="5"
        stroke-linecap="round"/>

  <path d="M 18 238 C 50 245 75 242 98 238"
        fill="none"
        stroke="#89CFF0"
        stroke-width="6"
        stroke-linecap="round"/>

</svg>
